<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>SloT VoIP — система</title>
<style>
  :root { --bg:#0f1420; --card:#1a2130; --line:#2a3446; --txt:#e6ebf2; --mut:#8a96a8; --accent:#3f8cff; --good:#37c26a; --warn:#ffbf47; --bad:#ff5a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; }
  header { min-height:68px; padding:14px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header .sub { color:var(--mut); font-size:13px; }
  .mode-nav { display:flex; gap:4px; margin-left:16px; padding:3px; border:1px solid var(--line); border-radius:8px; }
  .mode-nav a { color:var(--mut); text-decoration:none; padding:5px 10px; border-radius:5px; font-size:13px; white-space:nowrap; }
  .mode-nav a.active { background:var(--line); color:var(--txt); }
  .header-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }
  main { max-width:1440px; margin:0 auto; padding:20px 24px 40px; }
  .server { margin-bottom:30px; }
  .server-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .server-head h2 { margin:0; font-size:17px; font-weight:650; }
  .server-ip { color:var(--mut); font-size:13px; }
  .server-state { margin-left:auto; }
  .capture-controls { display:flex; align-items:center; gap:8px; margin:0 0 12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .capture-controls .capture-title { font-weight:600; margin-right:4px; }
  .capture-controls select { min-width:180px; height:34px; padding:0 30px 0 10px; color:var(--txt); background:#111827; border:1px solid var(--line); border-radius:7px; font:inherit; }
  .capture-controls button { color:#fff; background:var(--accent); border-color:var(--accent); }
  .capture-controls button:disabled { opacity:.45; cursor:not-allowed; }
  .capture-note { color:var(--mut); font-size:12px; }
  .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:12px; }
  .metric { min-height:150px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  .metric-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .label { color:var(--mut); font-size:11px; text-transform:uppercase; }
  .value { margin:13px 0 6px; font-size:30px; font-weight:650; }
  .hint { min-height:40px; color:var(--mut); font-size:12px; }
  .badge { display:inline-flex; padding:2px 8px; border-radius:20px; font-size:11px; }
  .good { color:var(--good); background:rgba(55,194,106,.14); }
  .warn { color:var(--warn); background:rgba(255,191,71,.14); }
  .bad { color:var(--bad); background:rgba(255,90,90,.14); }
  .neutral { color:var(--mut); background:rgba(138,150,168,.14); }
  .scale { height:5px; margin-top:13px; overflow:hidden; background:#111827; border-radius:3px; }
  .scale span { display:block; height:100%; width:0; background:var(--good); border-radius:3px; transition:width .2s ease; }
  .scale span.warn-fill { background:var(--warn); }
  .scale span.bad-fill { background:var(--bad); }
  .panel { border:1px solid var(--line); border-radius:8px; background:var(--card); overflow:hidden; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .panel-head h2 { margin:0; font-size:15px; font-weight:600; }
  .charts { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }
  .chart { min-width:0; padding:14px 16px 16px; border-right:1px solid var(--line); }
  .chart:last-child { border-right:0; }
  .chart-title { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; color:var(--mut); font-size:12px; }
  svg { display:block; width:100%; height:92px; overflow:visible; }
  .grid-line { stroke:var(--line); stroke-width:1; }
  .spark { fill:none; stroke:var(--accent); stroke-width:2; vector-effect:non-scaling-stroke; }
  .spark.warn-line { stroke:var(--warn); }
  .spark.bad-line { stroke:var(--bad); }
  button { height:34px; padding:0 11px; color:var(--txt); background:transparent; border:1px solid var(--line); border-radius:7px; cursor:pointer; font:inherit; }
  .mut { color:var(--mut); }
  .status { min-height:20px; margin-top:10px; color:var(--mut); font-size:12px; }
  @media (max-width:1000px) {
    .summary,.charts { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .chart:nth-child(2) { border-right:0; }
    .chart:nth-child(-n+2) { border-bottom:1px solid var(--line); }
  }
  @media (max-width:680px) {
    header { flex-wrap:wrap; padding:12px 16px; }
    header .sub { display:none; }
    .mode-nav { order:3; width:100%; margin:0; overflow-x:auto; }
    .header-actions { margin-left:auto; }
    main { padding:16px; }
    .summary { grid-template-columns:1fr; }
    .capture-controls { align-items:stretch; flex-direction:column; }
    .capture-controls select,.capture-controls button { width:100%; }
    .charts { grid-template-columns:1fr; }
    .chart { border-right:0; border-bottom:1px solid var(--line); }
    .chart:last-child { border-bottom:0; }
  }
</style>
</head>
<body>
<header>
  <h1>SloT VoIP</h1>
  <span class="sub">состояние голосовых серверов</span>
  <nav class="mode-nav" aria-label="Режим биллинга"><a href="/">Исходящие</a><a href="/dids">DIDs</a><a href="/monitoring">Мониторинг</a><a href="/invoice">Invoice</a><a class="active" href="/system">Система</a></nav>
  <div class="header-actions"><span class="mut" id="header-state">обновляю...</span><button onclick="load()">Обновить</button></div>
</header>
<main>
  <div id="servers"></div>
  <div class="status" id="status"></div>
</main>
<script>
let loading=false;
const thresholds={cpu:[70,85],loss:[1,3],jitter:[20,30]};

function severity(value,key) {
  if (value===null || value===undefined || Number.isNaN(Number(value))) return ['neutral','нет данных'];
  const [warn,bad]=thresholds[key]||[Infinity,Infinity];
  if (Number(value)>=bad) return ['bad','очень высокая'];
  if (Number(value)>=warn) return ['warn','повышенная'];
  return ['good','норма'];
}
function esc(value) {
  return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function metric(label,key,value,unit,max,hint,badgeOverride) {
  const [level,state]=badgeOverride||severity(value,key);
  const shown=value===null || value===undefined ? '—' : key==='calls'
    ? Number(value).toLocaleString('ru-RU')
    : `${Number(value).toFixed(key==='cpu'?1:2)}${unit}`;
  const width=value===null || value===undefined ? 0 : Math.min(100,Math.max(0,Number(value)/max*100));
  const fill=level==='bad'?'bad-fill':level==='warn'?'warn-fill':'';
  return `<div class="metric"><div class="metric-head"><div class="label">${esc(label)}</div><span class="badge ${level}">${esc(state)}</span></div><div class="value">${shown}</div><div class="hint">${esc(hint)}</div><div class="scale"><span class="${fill}" style="width:${width}%"></span></div></div>`;
}
function spark(values,suffix) {
  const clean=values.map(Number).filter(Number.isFinite);
  if (!clean.length) return {points:'',range:'нет данных'};
  const max=Math.max(1,...clean), min=Math.min(0,...clean), span=Math.max(1,max-min);
  const points=values.map((value,index)=>{
    const n=Number(value); if(!Number.isFinite(n)) return null;
    const x=values.length===1?300:index/(values.length-1)*300;
    const y=91-(n-min)/span*86;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).filter(Boolean).join(' ');
  return {points,range:`max ${max.toFixed(suffix==='%'?1:0)}${suffix}`};
}
function chart(label,values,suffix) {
  const line=spark(values,suffix);
  return `<div class="chart"><div class="chart-title"><span>${esc(label)}</span><span>${esc(line.range)}</span></div><svg viewBox="0 0 300 92" preserveAspectRatio="none"><line class="grid-line" x1="0" y1="91" x2="300" y2="91"/><polyline class="spark" points="${line.points}"/></svg></div>`;
}
function captureControls(node,data) {
  const captures=data.captures||[];
  const active=captures.find(item=>item.voice_node===node.id && ['pending','running'].includes(item.status));
  const vendors=data.vendors||[];
  const options=vendors.map(vendor=>`<option value="${esc(vendor.name)}">${esc(vendor.name)}</option>`).join('');
  const disabled=!node.online || !!active || !vendors.length;
  const state=active
    ? `<span class="badge warn">${active.status==='pending'?'ожидает агента':'идёт запись'} · ${esc(active.vendor_name)}</span>`
    : `<span class="capture-note">PCAP вендорской ноги + до 2 WAV</span>`;
  return `<div class="capture-controls"><span class="capture-title">Ручная диагностика</span><select id="capture-vendor-${esc(node.id)}" ${disabled?'disabled':''}>${options}</select><button type="button" ${disabled?'disabled':''} onclick="startManualCapture('${esc(node.id)}')">Записать 10 минут</button>${state}</div>`;
}
function renderNode(node,data) {
  const latest=node.latest;
  const quality=node.quality||{};
  const history=node.history||[];
  const state=node.online?['good','онлайн']:latest?['warn','данные устарели']:['neutral','нет данных'];
  const calls=latest?latest.active_calls:null;
  const last=latest?`Последнее измерение: ${esc(latest.sampled_at)} UTC · ${Number(node.age_seconds||0)} сек. назад`:'Агент мониторинга ещё не передал данные этого сервера.';
  return `<section class="server"><div class="server-head"><h2>${esc(node.name)}</h2><span class="server-ip">${esc(node.public_ip)}</span><span class="badge ${state[0]} server-state">${state[1]}</span></div>${captureControls(node,data)}<div class="summary">${metric('CPU Usage','cpu',latest?.cpu_percent??null,'%',100,latest?`Нагрузка сервера · steal ${Number(latest.cpu_steal_percent||0).toFixed(1)}%`:'Нет данных от агента')}${metric('Packet Loss','loss',quality.packet_loss_percent??null,'%',5,quality.rtp_legs?`Потеря голосовых пакетов · ${quality.rtp_legs} RTP legs`:'За 5 минут завершённых RTP-потоков нет')}${metric('Jitter','jitter',quality.jitter_ms??null,' ms',50,quality.rtp_packets?`Взвешено по ${Number(quality.rtp_packets).toLocaleString('ru-RU')} пакетам`:'За 5 минут завершённых RTP-потоков нет')}${metric('В разговоре','calls',calls,'',500,'Количество соединённых звонков сейчас',node.online?['good','live']:['neutral','offline'])}</div><div class="panel"><div class="panel-head"><h2>История за последние ${Number(data.history_hours||6)} часов</h2><span class="mut">качество: последние ${Number(data.quality_window_minutes||5)} минут</span></div><div class="charts">${chart('CPU',history.map(x=>x.cpu_percent),'%')}${chart('Packet Loss',history.map(x=>x.packet_loss_percent),'%')}${chart('Jitter',history.map(x=>x.jitter_ms),' ms')}${chart('Звонки',history.map(x=>x.active_calls),'')}</div></div><div class="status">${last}</div></section>`;
}
function render(data) {
  const nodes=data.nodes||[];
  document.getElementById('servers').innerHTML=nodes.map(node=>renderNode(node,data)).join('');
  const online=nodes.filter(node=>node.online).length;
  document.getElementById('header-state').textContent=nodes.length?`${online} из ${nodes.length} онлайн`:'нет серверов';
  document.getElementById('status').textContent=nodes.length?'Данные обновляются каждые 15 секунд.':'Голосовые серверы не настроены.';
}
async function load() {
  if (loading) return; loading=true;
  document.getElementById('header-state').textContent='обновляю...';
  try {
    const response=await fetch('/api/system-monitoring',{cache:'no-store'});
    if(!response.ok) throw new Error(await response.text());
    render(await response.json());
  } catch(error) {
    document.getElementById('header-state').textContent='ошибка';
    document.getElementById('status').textContent=error.message;
  } finally { loading=false; }
}
async function startManualCapture(nodeId) {
  const select=document.getElementById(`capture-vendor-${nodeId}`);
  const vendorName=select?.value;
  if(!vendorName) return;
  if(!confirm(`Запустить запись на 10 минут для ${vendorName}?`)) return;
  const button=select.nextElementSibling;
  button.disabled=true;
  document.getElementById('status').textContent='Передаю команду голосовому серверу...';
  try {
    const response=await fetch('/api/system-monitoring/manual-capture',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({voice_node:nodeId,vendor_name:vendorName})
    });
    if(!response.ok) throw new Error(await response.text());
    document.getElementById('status').textContent='Команда принята. Агент начнёт запись в течение 15 секунд.';
    await load();
  } catch(error) {
    button.disabled=false;
    document.getElementById('status').textContent=error.message;
  }
}
load(); setInterval(load,15000);
</script>
</body>
</html>
